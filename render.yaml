services:
  - type: web
    name: pepto
    env: static
    plan: free
    buildCommand: ""
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
